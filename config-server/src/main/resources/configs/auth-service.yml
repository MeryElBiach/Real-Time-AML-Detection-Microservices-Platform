server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/aml_db?currentSchema=auth_schema
    driver-class-name: org.postgresql.Driver
    username: aml_user
    password: aml_password

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth_schema
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000