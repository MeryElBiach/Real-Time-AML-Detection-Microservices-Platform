server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/aml_db?currentSchema=auth_schema
    driver-class-name: org.postgresql.Driver
    username: aml_user
    password: aml_password

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth_schema
    show-sql: true

app:
  jwt:
    secret: 7X3gK8mP1qV5rT9yN2wL6cH4zF8bJ0dS5uE1aR7nM3kQ9pV6xY2tC8fL4hG1zN5
    expiration-ms: 3600000