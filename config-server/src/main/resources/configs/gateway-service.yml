server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**
              filters:
                - StripPrefix=2

            - id: scoring-service
              uri: lb://scoring-service
              predicates:
                - Path=/api/scoring/**
              filters:
                - StripPrefix=2

            - id: alerts-service
              uri: lb://alerts-service
              predicates:
                - Path=/api/alerts/**
              filters:
                - StripPrefix=2

            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
app:
  jwt:
    secret: ${JWT_SECRET}
