server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alerts-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.meryem.aml.alertsservice.model.ScoredTransaction
        spring.json.use.type.headers: false

  datasource:
    url: jdbc:postgresql://localhost:5433/aml_db?currentSchema=alert_schema
    driver-class-name: org.postgresql.Driver
    username: aml_user
    password: aml_password

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: alert_schema
    show-sql: true