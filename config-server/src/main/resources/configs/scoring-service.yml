server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      #      le nom du groupe de lecteurs — obligatoire pour un consumer, sert à Kafka pour suivre où ce groupe en est dans sa lecture
      group-id: scoring-service-group
      #      : si ce service démarre pour la première fois, il lit depuis le début du topic (au lieu d'attendre seulement les nouveaux messages)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.meryem.aml.scoringservice.model.Transaction
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false